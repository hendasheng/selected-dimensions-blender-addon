name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build installable add-on
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/build.py --tag "$REF_NAME"
          else
            python scripts/build.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: selected-dimensions-package
          path: dist/selected_dimensions-*.zip
          if-no-files-found: error
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Selected Dimensions $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/selected_dimensions-*.zip --clobber
